<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOXEL — общайся свободно</title>
    
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage-compat.js"></script>
    
    <style>
        /* ============ ОСНОВНЫЕ СТИЛИ ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: #e4e4e4;
            height: 100vh;
            overflow: hidden;
        }

        /* ============ ТЕМЫ ============ */
        body.dark-theme {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #24243a;
            --text-primary: #e4e4e4;
            --text-secondary: #8a8a9a;
            --border-color: #2a2a3e;
        }

        body.light-theme {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8e8;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a6a;
            --border-color: #d0d0d0;
        }

        /* ============ ЭКРАН ВХОДА ============ */
        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a3e 50%, #2d1b4e 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-box {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            color: #667eea;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-form input {
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .auth-form input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .auth-btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .auth-divider {
            text-align: center;
            color: var(--text-secondary);
            margin: 15px 0;
            font-size: 13px;
        }

        .google-btn {
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: var(--border-color);
        }

        .error-message {
            color: #f44336;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        /* ============ ГЛАВНЫЙ ЭКРАН ============ */
        #main-screen {
            display: none;
            height: 100vh;
            background: var(--bg-primary);
        }

        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 20px;
            color: #667eea;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .search-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-item:hover {
            background: var(--bg-tertiary);
        }

        .chat-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-item div {
            flex: 1;
            min-width: 0;
        }

        .chat-item strong {
            display: block;
            color: var(--text-primary);
        }

        .chat-item-status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-card img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-card div {
            flex: 1;
        }

        .user-card span {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ============ ЦЕНТРАЛЬНАЯ ПАНЕЛЬ ============ */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            z-index: 5;
        }

        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-user-info .sticky-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-user-info div span {
            display: block;
        }

        #chat-username {
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 70%;
            animation: fadeIn 0.3s ease;
        }

        .message.my {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-text {
            padding: 10px 16px;
            border-radius: 16px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            word-break: break-word;
        }

        .message.my .message-text {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-text {
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
        }

        .message-input-area {
            padding: 12px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--bg-secondary);
        }

        .message-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        /* ============ СТАТУСЫ ============ */
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 6px;
        }

        .status-dot.online { background: #4caf50; }
        .status-dot.idle { background: #ffc107; }
        .status-dot.dnd { background: #f44336; }
        .status-dot.offline { background: #9e9e9e; }
        .status-dot.typing { 
            background: #667eea;
            animation: typingPulse 1s infinite;
        }

        @keyframes typingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ============ УВЕДОМЛЕНИЯ ============ */
        .notification {
            background: var(--bg-secondary);
            border-left: 4px solid #4caf50;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 400px;
        }

        .notification img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .notification div {
            flex: 1;
        }

        .notification strong {
            display: block;
            color: var(--text-primary);
        }

        .notification p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .notif-close {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            padding: 0 6px;
        }

        .slide-in {
            animation: slideIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .slide-out {
            animation: slideOut 0.5s forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px) scale(0.8); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(100px); }
        }

        /* ============ МОДАЛЬНЫЕ ОКНА ============ */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .settings-section {
            margin: 20px 0;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 12px;
        }

        .settings-section h3 {
            margin-bottom: 12px;
            color: var(--text-primary);
            font-size: 15px;
        }

        .settings-section label {
            display: block;
            margin: 10px 0 4px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .settings-section input,
        .settings-section textarea,
        .settings-section select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .theme-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.3s;
        }

        .theme-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* ============ ЗВОНКИ ============ */
        .call-content {
            max-width: 700px;
            text-align: center;
        }

        .call-content video {
            width: 45%;
            border-radius: 16px;
            background: #000;
            margin: 10px 5px;
        }

        #call-status {
            font-size: 18px;
            margin: 10px 0;
            color: var(--text-primary);
        }

        /* ============ ДРУЗЬЯ ============ */
        .friend-result {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            margin-top: 14px;
        }

        .friend-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .friend-tag {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ============ АНИМАЦИИ ============ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ SCROLLBAR ============ */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <!-- ============ ЭКРАН ВХОДА ============ -->
    <div id="auth-screen">
        <div class="auth-container">
            <div class="auth-box">
                <h1 class="logo">◈ VOXEL</h1>
                <p class="subtitle">Собери своё общение</p>
                
                <div class="auth-tabs">
                    <button class="tab active" data-tab="login">Вход</button>
                    <button class="tab" data-tab="register">Регистрация</button>
                </div>
                
                <!-- Форма входа -->
                <form id="login-form" class="auth-form active">
                    <input type="email" id="login-email" placeholder="Email" required />
                    <input type="password" id="login-password" placeholder="Пароль" required />
                    <button type="submit" class="auth-btn">Войти</button>
                </form>
                
                <!-- Форма регистрации -->
                <form id="register-form" class="auth-form">
                    <input type="text" id="reg-username" placeholder="Имя пользователя" required />
                    <input type="email" id="reg-email" placeholder="Email" required />
                    <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required />
                    <button type="submit" class="auth-btn">Создать аккаунт</button>
                </form>
                
                <div class="auth-divider">или</div>
                
                <button id="google-btn" class="google-btn">
                    🅶 Войти через Google
                </button>
                
                <p id="auth-error" class="error-message"></p>
            </div>
        </div>
    </div>

    <!-- ============ ГЛАВНЫЙ ЭКРАН ============ -->
    <div id="main-screen" style="display: none;">
        <!-- Левая панель (список чатов) -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>◈ VOXEL</h2>
                <button id="settings-btn" class="icon-btn">⚙️</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Поиск или ID #" />
            </div>
            
            <div class="chats-list" id="chats-list">
                <!-- Список чатов будет генерироваться -->
            </div>
            
            <div class="sidebar-footer">
                <div class="user-card" id="user-card">
                    <img id="current-avatar" src="" alt="avatar" />
                    <div>
                        <span id="current-username">Загрузка...</span>
                        <span class="status-dot online" id="current-status-dot"></span>
                    </div>
                    <button id="logout-btn" class="icon-btn">🚪</button>
                </div>
            </div>
        </div>

        <!-- Центральная панель (чат) -->
        <div class="chat-panel" id="chat-panel">
            <div class="chat-header" id="chat-header">
                <div class="chat-user-info">
                    <img id="chat-avatar" src="" alt="avatar" class="sticky-avatar" />
                    <div>
                        <span id="chat-username">Выберите чат</span>
                        <span class="status-text" id="chat-status">Онлайн</span>
                    </div>
                </div>
                <div class="chat-actions">
                    <button id="call-btn" class="icon-btn">📞</button>
                    <button id="video-call-btn" class="icon-btn">📹</button>
                </div>
            </div>
            
            <div class="messages-container" id="messages-container">
                <!-- Сообщения будут генерироваться -->
            </div>
            
            <div class="message-input-area">
                <button id="emoji-btn" class="icon-btn">😊</button>
                <input type="text" id="message-input" placeholder="Сообщение..." />
                <button id="send-btn" class="send-btn">➤</button>
            </div>
        </div>

        <!-- Правая панель (профиль/инфо) -->
        <div class="profile-panel" id="profile-panel">
            <div class="profile-content" id="profile-content">
                <!-- Будет заполняться -->
            </div>
        </div>
    </div>

    <!-- ============ МОДАЛЬНЫЕ ОКНА ============ -->
    
    <!-- Модалка настроек -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-settings">&times;</span>
            <h2>Настройки</h2>
            
            <div class="settings-section">
                <h3>Профиль</h3>
                <label>Аватар</label>
                <input type="file" id="avatar-upload" accept="image/*" />
                <label>Имя</label>
                <input type="text" id="settings-username" />
                <label>О себе</label>
                <textarea id="settings-bio" rows="3"></textarea>
                <label>Пол</label>
                <select id="settings-gender">
                    <option value="male">Мужчина</option>
                    <option value="female">Женщина</option>
                    <option value="unspecified">Не указано</option>
                </select>
            </div>
            
            <div class="settings-section">
                <h3>Статус</h3>
                <select id="settings-status">
                    <option value="online">🟢 Онлайн</option>
                    <option value="idle">🌙 Отошёл</option>
                    <option value="dnd">🔴 Не беспокоить</option>
                    <option value="offline">⚫ Невидимка</option>
                </select>
            </div>
            
            <div class="settings-section">
                <h3>Тема</h3>
                <button class="theme-btn" data-theme="dark">🌙 Тёмная</button>
                <button class="theme-btn" data-theme="light">☀️ Светлая</button>
            </div>
        </div>
    </div>

    <!-- Модалка поиска друзей -->
    <div id="friend-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-friend-modal">&times;</span>
            <h2>Добавить друга</h2>
            <input type="text" id="friend-id-input" placeholder="Введите ID # (например, 4281)" />
            <button id="search-friend-btn" class="auth-btn">Найти</button>
            <div id="friend-search-result"></div>
        </div>
    </div>

    <!-- Модалка звонка -->
    <div id="call-modal" class="modal">
        <div class="modal-content call-content">
            <span class="close-btn" id="close-call">&times;</span>
            <div id="call-status">🔄 Соединение...</div>
            <video id="local-video" autoplay muted></video>
            <video id="remote-video" autoplay></video>
            <button id="end-call-btn" class="auth-btn" style="background:red;">Завершить звонок</button>
        </div>
    </div>

    <!-- ============ ПОДКЛЮЧАЕМ СКРИПТЫ ============ -->
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>
    <script src="js/friends.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/calls.js"></script>
